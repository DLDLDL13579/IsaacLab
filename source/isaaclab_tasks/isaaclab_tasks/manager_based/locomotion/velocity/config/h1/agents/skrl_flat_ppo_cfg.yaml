# 随机种子
seed: 42


# 模型配置（使用skrl的模型实例化工具）
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  # 是否使用分离的模型
  separate: False
  # 策略模型配置
  policy:  # 高斯模型参数
    class: GaussianMixin  # 高斯分布混合类
    clip_actions: False  # 不禁用动作裁剪
    clip_log_std: True  # 启用对数标准差裁剪
    min_log_std: -20.0  # 最小对数标准差
    max_log_std: 2.0  # 最大对数标准差
    initial_log_std: 0.0  # 初始对数标准差
    # 网络结构
    network:
      - name: net  # 网络名称
        input: OBSERVATIONS  # 输入为观测
        layers: [128, 128, 128]  # 隐藏层维度（简化网络以适应平坦地形）
        activations: elu  # 激活函数
    output: ACTIONS  # 输出为动作
  # 价值模型配置
  value:  # 确定性模型参数
    class: DeterministicMixin  # 确定性混合类
    clip_actions: False  # 不禁用动作裁剪
    # 网络结构
    network:
      - name: net  # 网络名称
        input: OBSERVATIONS  # 输入为观测
        layers: [128, 128, 128]  # 隐藏层维度（简化网络以适应平坦地形）
        activations: elu  # 激活函数
    output: ONE  # 输出为单一值


# 滚动内存配置
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory  # 随机内存类
  memory_size: -1  # 自动确定（与agent:rollouts相同）


# PPO代理配置（字段名称来自PPO_DEFAULT_CONFIG）
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: PPO  # PPO代理类
  rollouts: 24  # 每个环境的滚动步数
  learning_epochs: 5  # 学习轮数
  mini_batches: 4  # 小批量数量
  discount_factor: 0.99  # 折扣因子
  lambda: 0.95  # 广义优势估计参数
  learning_rate: 1.0e-03  # 学习率
  learning_rate_scheduler: KLAdaptiveLR  # 学习率调度器
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01  # KL散度阈值
  state_preprocessor: null  # 状态预处理器
  state_preprocessor_kwargs: null  # 状态预处理器参数
  value_preprocessor: null  # 价值预处理器
  value_preprocessor_kwargs: null  # 价值预处理器参数
  random_timesteps: 0  # 随机时间步
  learning_starts: 0  # 学习开始时间步
  grad_norm_clip: 1.0  # 梯度裁剪
  ratio_clip: 0.2  # 比率裁剪
  value_clip: 0.2  # 价值裁剪
  clip_predicted_values: True  # 裁剪预测价值
  entropy_loss_scale: 0.01  # 熵损失缩放
  value_loss_scale: 1.0  # 价值损失缩放
  kl_threshold: 0.0  # KL散度阈值
  rewards_shaper_scale: 1.0  # 奖励塑造缩放
  time_limit_bootstrap: False  # 时间限制引导
  # 日志和检查点
  experiment:
    directory: "h1_flat"  # 实验目录
    experiment_name: ""  # 实验名称
    write_interval: auto  # 写入间隔
    checkpoint_interval: auto  # 检查点间隔


# 顺序训练器配置
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer  # 顺序训练器类
  timesteps: 24000  # 总时间步（减少以适应平坦地形）
  environment_info: log  # 环境信息日志
